# Stratum — PWA / mobile deployment profile.
# Streamlit ships a web-app manifest + service worker; these settings make it
# behave like an installable native-feeling app on phones.

[server]
headless = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[theme]
base = "dark"
backgroundColor = "#0E1116"
secondaryBackgroundColor = "#161B22"
textColor = "#FFFFFF"
primaryColor = "#2EE6A6"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = true
