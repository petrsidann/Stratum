[pytest]
# Sandbox environment fix (NOT a repo bug): libtmux 0.46.x auto-registers a
# broken pytest11 plugin that crashes pytest>=8 at config time with
# "Failed: Marks cannot be applied to fixtures" inside _prepareconfig.
# Disable only that plugin by its registered name so the suite can run.
addopts = -p no:libtmux
testpaths = tests
