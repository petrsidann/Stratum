name: Stratum Swarm Deploy

on:
  workflow_dispatch:
    inputs:
      match_query:
        description: 'Match to hunt (e.g., Al Hilal vs Al Nassr)'
        required: true
        type: string
      sport:
        description: 'Sport Category'
        required: true
        type: choice
        options: [soccer, nba, nfl, mlb, nhl]
        default: soccer
  push:
    paths:
      - 'scripts/**'
      - 'schemas/**'
      - '.github/workflows/deploy-swarm.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stratum-swarm
  cancel-in-progress: true

jobs:
  scan-universe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # CACHE REMOVED TO PREVENT MISSING FILE ERROR

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install aiohttp matplotlib numpy pandas requests beautifulsoup4 python-dotenv groq google-genai pydantic jsonschema

      - name: Execute Hunter Swarm
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          echo "Deploying Hunters for: ${{ inputs.match_query }}"
          python scripts/swarm_runner.py --query "${{ inputs.match_query }}" --sport "${{ inputs.sport }}"
          
          # Verify output exists before uploading artifact
          if [ ! -f data/hunts/latest.json ]; then
            echo "ERROR: swarm produced no result file."
            exit 1
          fi
          echo "Swarm complete. Result size: $(stat -c%s data/hunts/latest.json) bytes"

      - name: Upload Hunt Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hunt-output
          path: data/hunts/
          retention-days: 7

  commit-results:
    needs: run-swarm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Hunt Output
        uses: actions/download-artifact@v4
        with:
          name: hunt-output
          path: .

      - name: Commit Results to Repo
        run: |
          git config user.name "Stratum Bot"
          git config user.email "bot@stratum.ai"
          git add data/hunts/
          # Only commit if there are actual changes
          git diff --staged --quiet || git commit -m "swarm: ${{ inputs.match_query }} @ $(date -u +%FT%TZ)"
          git push origin main

  build-deploy-pwa:
    needs: commit-results
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Latest Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }} # Ensure we grab the freshly committed results

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        working-directory: ./app
        run: |
          npm ci --prefer-offline --no-audit --fund=false
          npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './app/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
