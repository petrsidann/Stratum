name: Stratum Swarm Deploy

on:
  workflow_dispatch: {}
  schedule:
    - cron: '*/15 * * * *'
  push:
    paths:
      - 'scripts/**'
      - 'schemas/**'
      - '.github/workflows/deploy-swarm.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stratum-swarm
  cancel-in-progress: true

jobs:
  scan-universe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install aiohttp matplotlib numpy pandas requests beautifulsoup4 python-dotenv groq google-genai pydantic jsonschema

      - name: Execute Hunter Swarm (Input-Free Slate Scan)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          echo "Launching scheduled swarm across today+tomorrow slate..."
          # CRITICAL FIX: Ensure output goes EXACTLY where frontend expects
          mkdir -p data
          python scripts/swarm_runner.py scan-slate || {
            echo "ERROR: scan-slate failed or produced no output."
            exit 1
          }
          
          if [ ! -f data/market_universe.json ]; then
            echo "FATAL: market_universe.json missing after scan attempt."
            ls -laR data/
            exit 1
          fi
          
          SIZE=$(stat -c%s data/market_universe.json)
          echo "Swarm complete. Universe size: $SIZE bytes at data/market_universe.json"

      - name: Upload Hunt Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hunt-output
          path: data/market_universe.json  # ONLY upload the critical file
          retention-days: 7

  commit-results:
    needs: scan-universe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository on main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download Hunt Output
        uses: actions/download-artifact@v4
        with:
          name: hunt-output
          path: data/

      - name: Commit Results to Repo
        run: |
          git config user.name "Stratum Bot"
          git config user.email "bot@stratum.ai"
          git checkout main
          git pull origin main --rebase || true  # Safe sync before push
          git add data/market_universe.json     # Stage ONLY the universe file
          if ! git diff --staged --quiet; then
            echo "Changes detected. Creating commit..."
            git commit -m "swarm: universe scan @ $(date -u +%FT%TZ)"
            git push origin main
          else
            echo "No changes detected. Skipping push."
          fi

  build-deploy-pwa:
    needs: commit-results
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Latest Code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        working-directory: ./app
        run: |
          npm ci --prefer-offline --no-audit --fund=false
          npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './app/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
