name: Stratum Swarm Deploy

on:
  workflow_dispatch: {}
  schedule:
    - cron: '*/15 * * * *'
  push:
    paths:
      - 'scripts/**'
      - 'schemas/**'
      - '.github/workflows/deploy-swarm.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stratum-swarm
  cancel-in-progress: true

jobs:
  scan-universe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute Slate Scan (stdlib only, always writes universe file)
        run: |
          mkdir -p data
          python scripts/slate_scan.py
          if [ ! -f data/market_universe.json ]; then
            echo "FATAL: universe file missing"; exit 1
          fi
          echo "Universe size: $(stat -c%s data/market_universe.json) bytes"

      - name: Upload Hunt Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hunt-output
          path: data/
          retention-days: 7

  commit-results:
    needs: scan-universe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download Hunt Output
        uses: actions/download-artifact@v4
        with:
          name: hunt-output
          path: data/

      - name: Commit Results to Repo
        run: |
          git config user.name "Stratum Bot"
          git config user.email "bot@stratum.ai"
          git add data/market_universe.json data/hunt_status.json
          if ! git diff --staged --quiet; then
            git commit -m "swarm: universe scan @ $(date -u +%FT%TZ)"
            git push origin HEAD:refs/heads/main
          else
            echo "No changes. Skipping push."
          fi

  build-deploy-pwa:
    needs: commit-results
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        working-directory: ./app
        run: |
          npm install --prefer-offline --no-audit --fund=false
          npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './app/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
