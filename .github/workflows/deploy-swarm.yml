name: Stratum Swarm Deploy

# STRATUM V3.0 SCHEDULED-SWARM architecture (pivot from on-demand hunts):
#   scan-universe    -> `swarm_runner.py scan-slate` scans today+tomorrow
#                       boards across all configured ESPN leagues (plus any
#                       discovered JSON book sources), runs the 4-agent math
#                       pipeline per fixture, and publishes ONE aggregate:
#                       data/market_universe.json (+ replayable hunt_status.json)
#   commit-results   -> race-proof push of data/ back to main
#   build-deploy-pwa -> rebuild + deploy Pages on top of fresh universe data
# The PWA loads market_universe.json once and filters CLIENT-SIDE — there is
# no browser->workflow trigger anywhere in the user flow.

on:
  schedule:
    # Universe rescan every 15 minutes (client caches one static file).
    - cron: '*/15 * * * *'
  workflow_dispatch: {}   # manual force-rescan; NO inputs (schedule/push runs
                          # supply empty inputs and must not crash)
  push:
    paths:
      - 'scripts/**'
      - 'schemas/**'
      - '.github/workflows/deploy-swarm.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stratum-swarm
  cancel-in-progress: true

jobs:
  scan-universe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Optional LLM context for agent_context (neutral fallback if absent).
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # NO cache line: repo-root requirements.txt
                                   # exists as the cache anchor, but we install
                                   # --no-cache-dir anyway; removing the hash
                                   # key kills the "No file matched
                                   # **/requirements.txt" hard failure.

      - name: Install Dependencies
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          pip install --no-cache-dir \
            aiohttp matplotlib numpy pandas requests beautifulsoup4 \
            python-dotenv groq google-genai pydantic jsonschema

      - name: Scan fixture slate (scheduled swarm cycle)
        # Input-FREE by design: schedule/push triggers supply empty inputs.
        # scan-slate builds today+tomorrow boards across the expanded ESPN
        # league set, runs scout->actuary->context->strategist math per
        # fixture, validates + publishes data/market_universe.json and a
        # replayable data/hunt_status.json. Exit 0 = universe published &
        # schema-valid; exit 2 = valid run whose slate is honestly empty.
        run: |-
          python scripts/swarm_runner.py scan-slate
          rc=$?
          if [ "$rc" -eq 0 ]; then exit 0; fi
          if [ "$rc" -eq 2 ]; then
            echo "::notice::Scan completed with an empty slate (honest zero-fixture outcome)."
            exit 0
          fi
          exit "$rc"

      - name: Upload universe artifact
        uses: actions/upload-artifact@v4
        with:
          name: hunt-output
          path: |
            data/market_universe.json
            data/hunt_status.json
            data/hunts/latest.json
            data/hunts/*/
          if-no-files-found: error
          retention-days: 7

  commit-results:
    needs: [scan-universe]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download universe output
        uses: actions/download-artifact@v4
        with:
          name: hunt-output
          path: .

      - name: Commit & push results (race-proof reset-to-origin pattern)
        run: |
          git config user.name "stratum-swarm-bot"
          git config user.email "stratum-swarm-bot@users.noreply.github.com"
          mkdir -p data
          ls -la data/market_universe.json data/hunt_status.json || true
          git add data/market_universe.json data/hunt_status.json data/hunts/ schemas/ || true
          if git diff --staged --quiet; then
            echo "No new universe data to commit."
            exit 0
          fi
          git commit -m "chore: universe scan $(date -u +%FT%TZ)"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            echo "push rejected (attempt $attempt) — rebasing onto origin/main"
            git fetch --no-tags origin main
            git reset --soft "$(git rev-parse origin/main)" 2>/dev/null || true
            git pull --rebase origin main || true
            git add data/market_universe.json data/hunt_status.json data/hunts/ || true
            git diff --staged --quiet && { echo "nothing left to push"; exit 0; }
            git commit -m "chore: universe scan $(date -u +%FT%TZ)" || true
          done
          echo "failed to push after retries" >&2; exit 1

  build-deploy-pwa:
    needs: [commit-results]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository (with committed universe)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Bundle live universe into site payload
        # The PWA fetches ./data/market_universe.json from the deployed site
        # first (same-origin, always fresh with the deploy), falling back to
        # raw.githubusercontent.com. Baking it in removes cold-start races.
        run: |
          mkdir -p app/public/data
          cp -f data/market_universe.json app/public/data/market_universe.json
          cp -f data/hunt_status.json app/public/data/hunt_status.json
          rm -rf app/public/data/hunts
          cp -r data/hunts app/public/data/hunts || true

      - name: Build PWA
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./app/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
