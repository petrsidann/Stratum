name: Hunt Now (Real-Time Scan)

# Hunter Mode trigger: manual, on-demand scan of ONE match query across
# Betika / Odibets / Flashscore (+ real price mirrors), quant-processed and
# published as an artifact. NO schedule -- workflow_dispatch only, so nothing
# ever waits on a cron cycle to get fresh data.

on:
  workflow_dispatch:
    inputs:
      match_query:
        description: 'Match to hunt (exact team names work best)'
        required: true
        type: string
        default: 'Al Hilal vs Al Nassr'
      sport:
        description: 'Sport'
        required: true
        type: choice
        options:
          - soccer
          - basketball
          - tennis
          - auto
        default: soccer

permissions:
  contents: write    # hunt results are committed back to main for the PWA poller

concurrency:
  group: hunt-now
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install --no-cache-dir requests beautifulsoup4 lxml

      - name: Run Real-Time Hunt
        env:
          HUNT_TIMEOUT_S: '10'        # kill any source request > 10s
          HUNT_RATE_LIMIT_S: '1.0'    # >= 1s between requests per domain
        run: |
          python scripts/hunter_api.py \
            --query "${{ inputs.match_query }}" \
            --sport "${{ inputs.sport }}" \
            --output hunt-result.json
          echo "--- hunt-result.json (head) ---"
          head -c 2000 hunt-result.json || true

      - name: Stage committed artifacts (data/hunts/ queue layout)
        if: always()
        env:
          HUNT_STAGE: '1'             # opt-in mirroring inside hunter_api.py
          HUNT_ID: 'gha-${{ github.run_id }}-${{ github.run_attempt }}'
        run: |
          # Re-emit the already-written hunt-result.json into the PWA-readable
          # queue layout (data/hunts/<stamp>/hunt_result.json + latest.json
          # pointer). If the scan itself produced no file, publish an honest
          # error pointer instead so pollers terminate quickly.
          if [ -f hunt-result.json ]; then
            python scripts/publish_hunt_artifacts.py hunt-result.json
          else
            mkdir -p data/hunts
            python3 - <<'PY'
          import json, datetime
          pointer = {
              "hunt_id": "gha-${{ github.run_id }}-${{ github.run_attempt }}",
              "status": "error",
              "stage": "runner_failure",
              "progress": 1.0,
              "updated_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "result_path": "",
          }
          with open("data/hunts/latest.json", "w") as fh:
              json.dump(pointer, fh, indent=2)
          PY
          fi

      - name: Commit hunt artifacts to main
        if: always()
        run: |
          git config user.name "Stratum Bot"
          git config user.email "bot@stratum.ai"
          git add data/hunts || true
          if ! git diff --staged --quiet; then
            git commit -m "hunt: ${{ inputs.match_query }} @ $(date -u +%FT%TZ)"
            for attempt in 1 2 3; do
              git pull --rebase origin main && break || sleep $((attempt * 3))
            done
            git push origin HEAD:refs/heads/main
          else
            echo "No hunt artifacts to commit."
          fi

      - name: Upload Hunt Result Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hunt-result
          path: hunt-result.json
          if-no-files-found: error
