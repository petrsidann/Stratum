# Stratum Ghost Server — "Logic in Actions, UI in Pages."
#
# The ONLY backend process in production: every 5 minutes (and on demand)
# this workflow runs the quant engine, writes strictly-validated JSON to
# data/, and commits it. The GitHub Pages frontend just fetches those files.
name: Stratum Market Scanner

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (UTC)
  workflow_dispatch: {}      # manual trigger from the Actions tab

# One scan at a time; a new run supersedes an old one still committing.
concurrency:
  group: scan-engine
  cancel-in-progress: false

permissions:
  contents: write   # commit data/*.json back to the repo

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run market scan engine
        id: scan
        env:
          # Optional: with no secrets configured the scan still completes
          # (deterministic fallbacks everywhere — reliability first).
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python scripts/run_daily_scan.py

      - name: Upload scan artifacts (debug snapshot)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-output
          path: |
            data/latest_scan.json
            data/portfolio_stats.json
            data/history.csv
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit & push updated data (only if changed)
        run: |
          git config user.name "stratum-bot"
          git config user.email "stratum-bot@users.noreply.github.com"
          git add data/latest_scan.json data/portfolio_stats.json data/history.csv
          if git diff --cached --quiet; then
            echo "No data changes detected — skipping commit."
          else
            git commit -m "chore(scan): update market data $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push origin HEAD:"${{ github.ref_name }}"
          fi

      - name: Flag critical alerts (workflow summary + warning annotation)
        if: steps.scan.outputs.critical_alerts != '' && steps.scan.outputs.critical_alerts != '0'
        run: |
          {
            echo "## 🚨 Stratum Critical Alerts"
            echo ""
            echo "**${{ steps.scan.outputs.critical_alerts }}** signal(s) scored above the critical confidence threshold in this scan (${{ steps.scan.outputs.matches_scanned }} matches)."
            echo ""
            echo "See \`data/latest_scan.json\` for full detail."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Stratum::Critical alert count = ${{ steps.scan.outputs.critical_alerts }}"
