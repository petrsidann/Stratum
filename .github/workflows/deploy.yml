name: Stratum Production Pipeline

on:
  workflow_dispatch: # Allows manual trigger from UI
  schedule:
    - cron: '*/30 * * * *' # Runs every 30 minutes to keep data fresh

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # JOB A: Generate Data (Python Scanner)
  scan-data-gen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          # CRITICAL FIX: Wrapped version specs in quotes to prevent shell redirection errors (< symbol)
          pip install "numpy>=1.26,<2.0" "pandas>=2.1,<2.3" requests beautifulsoup4 python-dotenv pytest

      - name: Run Market Scanner
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          echo "Starting Stratum Scanner..."
          python scripts/run_daily_scan.py
          
          # Verify output exists and is not empty
          if [ ! -f data/latest_scan.json ]; then
            echo "ERROR: latest_scan.json was not created."
            exit 1
          fi
          
          SIZE=$(stat -c%s "data/latest_scan.json")
          echo "Generated latest_scan.json ($SIZE bytes)"
          
          if [ "$SIZE" -lt 1000 ]; then
            echo "WARNING: File seems too small (<1KB). Checking content..."
            cat data/latest_scan.json
          fi

      - name: Upload Scan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stratum-data
          path: data/
          retention-days: 1

  # JOB B: Build Frontend (React/Vite)
  build-frontend:
    needs: scan-data-gen
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Scan Data
        uses: actions/download-artifact@v4
        with:
          name: stratum-data
          path: data/

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Explicitly point to lockfile to fix cache resolution error
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Copy Data into Frontend Public Folder
        working-directory: ./frontend
        run: |
          mkdir -p public/data
          cp ../data/latest_scan.json public/data/latest_scan.json
          cp ../data/portfolio_stats.json public/data/portfolio_stats.json || true

      - name: Build React App
        working-directory: ./frontend
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Dist Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'

  # JOB C: Deploy to GitHub Pages
  deploy:
    needs: build-frontend
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
