name: Stratum Native Build Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write # Needed to commit updates back to repo if necessary
  pages: write    # Optional, if we deploy web preview later
  id-token: write

jobs:
  # JOB 1: Run the Brain (Python Scanner)
  run-quant-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          # Using flexible versions wrapped in quotes to prevent shell errors
          pip install "numpy>=1.26,<2.0" "pandas>=2.1,<2.3" requests beautifulsoup4 python-dotenv pydantic
      
      - name: Execute Market Scan
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          echo "Starting Stratum Engine..."
          python scripts/engine.py
          
          # Verify output exists
          if [ ! -f data/live_market_feed.json ]; then
            echo "ERROR: live_market_feed.json was NOT created."
            exit 1
          fi
          
          SIZE=$(stat -c%s "data/live_market_feed.json")
          echo "Generated feed ($SIZE bytes)"
          
          # CRITICAL FIX: Upload the data as an artifact named 'engine-state'
          # This allows Job 3 to download it reliably without relying on git commits
      - name: Upload Engine State Artifact
        uses: actions/upload-artifact@v4
        with:
          name: engine-state
          path: data/live_market_feed.json
          retention-days: 1

  # JOB 2: Commit Data to Repo (For History/Audit Trail)
  commit-live-feed:
    needs: run-quant-engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Engine State
        uses: actions/download-artifact@v4
        with:
          name: engine-state
          path: data/
          
      - name: Commit Updated Feed
        run: |
          git config user.name "Stratum Bot"
          git config user.email "bot@stratum.ai"
          git add data/live_market_feed.json
          git diff --staged --quiet || git commit -m "chore: update live market feed $(date +%Y-%m-%d_%H:%M)"
          git push

  # JOB 3: Build the Native App (Expo/EAS)
  build-android-apk:
    needs: [run-quant-engine, commit-live-feed]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install EAS CLI & Expo Dependencies
        working-directory: ./app
        run: |
          # 1. Install global tools first
          npm install -g eas-cli --no-audit --fund=false
          
          # 2. CRITICAL FIX: Use 'npm install' instead of 'npm ci'
          # 'npm ci' fails without a lockfile. 'npm install' creates one if missing.
          npm install --prefer-offline --no-audit --fund=false
          
      - name: Configure Environment Variables for Build
        working-directory: ./app
        run: |
          # Pass the API URL or local path logic here if needed
          # For MVP, the app reads directly from raw.githubusercontent.com
          echo "EXPO_PUBLIC_ENV=production" >> .env.production
          
      - name: Build Android APK via EAS
        working-directory: ./app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }} # You MUST create this secret in GitHub Settings -> Secrets
        run: |
          # Use EAS Build to generate a standalone APK
          # --profile production ensures optimized release build
          eas build --platform android --profile production --non-interactive --output=stratum-release.apk
      
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stratum-apk-release
          path: ./app/stratum-release.apk
          retention-days: 7
